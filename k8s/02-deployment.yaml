# ============================================================
# k8s/02-deployment.yaml
# Deployment Next.js App + HPA (Horizontal Pod Autoscaler)
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: th-app
  namespace: talento-humano
  labels:
    app.kubernetes.io/name: th-app
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: talento-humano
  annotations:
    # Fuerza re-deploy al cambiar la imagen
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2                        # Mínimo HA: 2 réplicas
  selector:
    matchLabels:
      app: th-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # Zero-downtime deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: th-app
        version: "latest"
      annotations:
        # Reinicia pods si cambia el Secret
        checksum/secret: "{{ include (print $.Template.BasePath \"/01-configmap-secrets.yaml\") . | sha256sum }}"
    spec:
      serviceAccountName: th-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      # Garantiza distribución entre AZs
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: th-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: th-app
                topologyKey: kubernetes.io/hostname
      initContainers:
        # Ejecuta migraciones Prisma antes de arrancar la app
        - name: prisma-migrate
          image: 123456789.dkr.ecr.us-east-1.amazonaws.com/talento-humano:$(IMAGE_TAG)
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: th-app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      containers:
        - name: th-app
          image: 123456789.dkr.ecr.us-east-1.amazonaws.com/talento-humano:$(IMAGE_TAG)
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: th-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: th-app-secrets
                  key: DATABASE_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: th-app-secrets
                  key: REDIS_PASSWORD
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: th-app-secrets
                  key: NEXTAUTH_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Liveness: ¿sigue vivo el proceso?
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Readiness: ¿listo para recibir tráfico?
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          # Startup: da tiempo extra al primer arranque (Prisma connect)
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

---
# HPA: escala de 2 a 10 réplicas por CPU/Memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: th-app-hpa
  namespace: talento-humano
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: th-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Espera 5 min antes de escalar abajo

---
# PodDisruptionBudget: mínimo 1 pod disponible durante mantenimiento
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: th-app-pdb
  namespace: talento-humano
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: th-app
