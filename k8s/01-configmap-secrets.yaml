# ============================================================
# k8s/01-configmap-secrets.yaml
# ConfigMap (valores no sensibles) + Secret (valores sensibles)
# En producción los secrets se inyectan desde AWS Secrets Manager
# via External Secrets Operator (ESO) — ver comentario al pie.
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: th-app-config
  namespace: talento-humano
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  # PostgreSQL host (RDS endpoint) — set at deploy time via Helm/Kustomize
  DB_HOST: "talento-humano-db.cluster-xxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "talento_humano"
  REDIS_HOST: "th-redis.talento-humano.svc.cluster.local"
  REDIS_PORT: "6379"

---
# ⚠️  Sólo como referencia — en producción usar External Secrets Operator
# kubectl create secret generic th-app-secrets \
#   --from-literal=DATABASE_URL='postgresql://...' \
#   --from-literal=REDIS_PASSWORD='...' \
#   -n talento-humano --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: th-app-secrets
  namespace: talento-humano
type: Opaque
# Los valores son base64 de los placeholders — reemplazar en CI/CD
stringData:
  DATABASE_URL: "postgresql://th_user:REPLACE_ME@$(DB_HOST):5432/talento_humano?schema=public&sslmode=require"
  REDIS_PASSWORD: "REPLACE_ME"
  NEXTAUTH_SECRET: "REPLACE_ME"

